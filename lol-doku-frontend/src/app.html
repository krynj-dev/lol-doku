<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<!-- <link rel="icon" href="%sveltekit.assets%/favicon.png" /> -->
	<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://lolprogrid.com">
	<meta property="og:title" content="Lol Pro Grid">
	<meta property="og:description"
		content="A League of Legends Esports Wordle-like daily game inspired by the likes of GeoGrid, PokeDoku, and Puckdoku.">
	<meta property="og:image" content="%sveltekit.assets%/img/preview.png">
	<meta property="og:image:width" content="1000">
	<meta property="og:image:height" content="800">
	<meta property="og:locale" content="en_US">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="%sveltekit.assets%/lol.css" />
	<link rel="stylesheet" href="%sveltekit.assets%/doku.css" />
	<script type='text/javascript' src='https://storage.ko-fi.com/cdn/widget/Widget_2.js'></script>
	<style>
		body {
			margin: 0;
			background-color: var(--lol-doku-white-1);
			color: var(--lol-hextech-black);
			overflow-x: hidden;
		}

		a:visited {
			color: var(--lol-blue-3)
		}

		a:not(visited) {
			color: var(--lol-gold-4)
		}

		:focus {
			/* outline: 1px solid var(--lol-blue-1);
				outline-offset: -1px; */
			outline: 0;
		}
	</style>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
